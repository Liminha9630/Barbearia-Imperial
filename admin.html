<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Barbeiro | Barbearia Imperial</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #121214;
            --bg-secondary: #18181b;
            --bg-card: #202024;
            --border: #2e2e36;
            --gold: #d4af37;
            --gold-hover: #b3922f;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --accent: #22c55e;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); min-height: 100vh; }

        #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .login-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: 100%; max-width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .login-logo { text-align: center; margin-bottom: 30px; }
        .login-logo h1 { color: var(--gold); font-size: 22px; letter-spacing: 2px; margin-top: 10px; }

        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
        .form-input { width: 100%; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: var(--text-main); font-size: 14px; outline: none; transition: 0.2s; }
        .form-input:focus { border-color: var(--gold); }

        .btn-submit { width: 100%; background: var(--gold); color: #000; border: none; border-radius: 8px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-submit:hover { background: var(--gold-hover); }
        .error-msg { color: var(--danger); font-size: 12px; margin-top: 10px; text-align: center; display: none; }

        #admin-panel { display: none; }
        header { background-color: var(--bg-secondary); border-bottom: 1px solid var(--border); padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        .stat-title { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .stat-value { font-size: 28px; font-weight: 700; color: var(--gold); margin-top: 8px; }

        .filter-bar { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 25px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
        .appointments-table-container { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 16px; font-size: 14px; border-bottom: 1px solid var(--border); }
        th { background: var(--bg-card); color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }
        tr:last-child td { border-bottom: none; }

        .badge { padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; }
        .badge-confirmed { background: rgba(34, 197, 94, 0.1); color: var(--accent); }

        .actions-cell { display: flex; gap: 8px; }
        .btn-action { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
        .btn-action.whatsapp { background: rgba(37, 211, 102, 0.1); color: #25d366; border-color: rgba(37, 211, 102, 0.2); }
        .btn-action.cancel { background: rgba(239, 68, 68, 0.1); color: var(--danger); border-color: rgba(239, 68, 68, 0.2); }
        .logout-btn { background: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; }
        .logout-btn:hover { background: var(--danger); color: #fff; }
        .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <div class="login-logo">
                <div style="background:var(--gold); color:#000; width:50px; height:50px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:bold; margin:0 auto;">✂</div>
                <h1>PAINEL PROFISSIONAL</h1>
            </div>
            <div class="form-group">
                <label class="form-label">Usuário</label>
                <input type="text" class="form-input" id="login-user" placeholder="admin">
            </div>
            <div class="form-group">
                <label class="form-label">Senha</label>
                <input type="password" class="form-input" id="login-pass" placeholder="imperial2026">
            </div>
            <button class="btn-submit" onclick="handleLogin()">Entrar no Sistema</button>
            <div class="error-msg" id="login-error">Usuário ou senha incorretos!</div>
        </div>
    </div>

    <div id="admin-panel">
        <header>
            <div style="display:flex; align-items:center; gap:12px;">
                <div style="background:var(--gold); color:#000; width:36px; height:36px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-weight:bold;">✂</div>
                <div>
                    <h2 style="font-size:16px;">Barbearia Imperial</h2>
                    <p style="font-size:11px; color:var(--gold);">Gestão em Nuvem em Tempo Real</p>
                </div>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button class="btn-action" onclick="renderAppointmentsTable()">🔄 Atualizar Dados</button>
                <button class="logout-btn" onclick="handleLogout()">Sair</button>
            </div>
        </header>

        <div class="container">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-title">Agendamentos Totais</div>
                    <div class="stat-value" id="stat-total">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Agendamentos Hoje</div>
                    <div class="stat-value" id="stat-today">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-title">Faturamento Estimado</div>
                    <div class="stat-value" id="stat-revenue">R$ 0,00</div>
                </div>
            </div>

            <div class="filter-bar">
                <div style="flex: 1; min-width: 200px;">
                    <label class="form-label">Filtrar por Profissional</label>
                    <select class="form-input" id="filter-barber" onchange="renderAppointmentsTable()">
                        <option value="">Todos os Barbeiros</option>
                        <option value="Elilto Lima">Elilto Lima</option>
                        <option value="Marcos Vinicius">Marcos Vinicius</option>
                        <option value="Lucas Souza">Lucas Souza</option>
                    </select>
                </div>
                <div style="flex: 1; min-width: 200px;">
                    <label class="form-label">Filtrar por Data</label>
                    <input type="date" class="form-input" id="filter-date" onchange="renderAppointmentsTable()">
                </div>
                <div style="display: flex; align-items: flex-end;">
                    <button class="btn-action" style="padding: 12px 16px;" onclick="clearFilters()">Limpar Filtros</button>
                </div>
            </div>

            <div class="appointments-table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Data / Horário</th>
                            <th>Cliente</th>
                            <th>Serviço</th>
                            <th>Profissional</th>
                            <th>Valor</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="appointments-tbody">
                        <tr><td colspan="7" class="empty-state">Carregando agendamentos da nuvem...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const BIN_ID = "6752d58cad19514462615436";
        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
        const ADMIN_USER = "admin";
        const ADMIN_PASS = "imperial2026";
        let cloudAppointments = [];

        window.onload = function() {
            if (localStorage.getItem('imperial_logged_in') === 'true') {
                showPanel();
            }
        };

        function handleLogin() {
            const user = document.getElementById('login-user').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            if (user === ADMIN_USER && pass === ADMIN_PASS) {
                localStorage.setItem('imperial_logged_in', 'true');
                showPanel();
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        function handleLogout() {
            localStorage.removeItem('imperial_logged_in');
            document.getElementById('admin-panel').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
        }

        async function showPanel() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            await renderAppointmentsTable();
        }

        async function fetchAdminData() {
            try {
                const response = await fetch(API_URL, {
                    headers: { "X-Master-Key": "$2a$10$7v2uR.621qQ31rTj1S1Bhe7k1Q0J1J83W1f0Kqg23K765JzT0Q45G" }
                });
                const data = await response.json();
                cloudAppointments = data.record.appointments || [];
            } catch (e) {
                cloudAppointments = JSON.parse(localStorage.getItem('imperial_appointments')) || [];
            }
        }

        async function saveAdminData(newList) {
            try {
                await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        "Content-Type": "application/json",
                        "X-Master-Key": "$2a$10$7v2uR.621qQ31rTj1S1Bhe7k1Q0J1J83W1f0Kqg23K765JzT0Q45G"
                    },
                    body: JSON.stringify({ appointments: newList })
                });
            } catch (e) {
                localStorage.setItem('imperial_appointments', JSON.stringify(newList));
            }
        }

        async function renderAppointmentsTable() {
            await fetchAdminData();
            
            cloudAppointments.sort((a, b) => {
                if (a.date !== b.date) return a.date.localeCompare(b.date);
                return a.time.localeCompare(b.time);
            });

            const filterBarber = document.getElementById('filter-barber').value;
            const filterDate = document.getElementById('filter-date').value;

            let filtered = cloudAppointments.filter(a => {
                let matchBarber = filterBarber ? a.barberName === filterBarber : true;
                let matchDate = filterDate ? a.date === filterDate : true;
                return matchBarber && matchDate;
            });

            document.getElementById('stat-total').innerText = cloudAppointments.length;
            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('stat-today').innerText = cloudAppointments.filter(a => a.date === todayStr).length;
            const totalRevenue = cloudAppointments.reduce((acc, curr) => acc + curr.servicePrice, 0);
            document.getElementById('stat-revenue').innerText = `R$ ${totalRevenue.toFixed(2).replace('.', ',')}`;

            const tbody = document.getElementById('appointments-tbody');
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="empty-state">Nenhum agendamento encontrado na nuvem.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(a => {
                const [y, m, d] = a.date.split('-');
                const formattedDate = `${d}/${m}/${y}`;
                const cleanPhone = a.clientPhone.replace(/\D/g, '');
                const waLink = `https://wa.me/55${cleanPhone}?text=${encodeURIComponent(`Olá ${a.clientName}, tudo bem? Aqui é da Barbearia Imperial referente ao seu agendamento de ${a.serviceName} dia ${formattedDate} às ${a.time}.`)}`;

                return `
                    <tr>
                        <td><strong>${formattedDate}</strong><br><span style="color:var(--gold); font-weight:600;">${a.time}</span></td>
                        <td>
                            <strong>${a.clientName}</strong><br>
                            <span style="font-size:12px; color:var(--text-muted);">📞 ${a.clientPhone}</span>
                            ${a.clientObs ? `<br><span style="font-size:11px; color:var(--gold);">Obs: ${a.clientObs}</span>` : ''}
                        </td>
                        <td>${a.serviceName}</td>
                        <td>${a.barberName}</td>
                        <td style="color:var(--gold); font-weight:600;">R$ ${a.servicePrice.toFixed(2).replace('.', ',')}</td>
                        <td><span class="badge badge-confirmed">Confirmado</span></td>
                        <td>
                            <div class="actions-cell">
                                <a href="${waLink}" target="_blank" class="btn-action whatsapp">💬 WhatsApp</a>
                                <button class="btn-action cancel" onclick="cancelAdminAppointment(${a.id})">Cancelar</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function clearFilters() {
            document.getElementById('filter-barber').value = '';
            document.getElementById('filter-date').value = '';
            renderAppointmentsTable();
        }

        async function cancelAdminAppointment(id) {
            if (confirm("Tem certeza que deseja cancelar este agendamento? O horário será liberado na nuvem.")) {
                cloudAppointments = cloudAppointments.filter(a => a.id !== id);
                await saveAdminData(cloudAppointments);
                renderAppointmentsTable();
            }
        }
    </script>
</body>
</html>
