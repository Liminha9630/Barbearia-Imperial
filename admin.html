<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Barbeiro | Barbearia Imperial</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Biblioteca Oficial do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-primary: #121214; --bg-secondary: #18181b; --bg-card: #202024;
            --border: #2e2e36; --gold: #d4af37; --gold-hover: #b3922f;
            --text-main: #f4f4f5; --text-muted: #a1a1aa; --accent: #22c55e; --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); min-height: 100vh; }
        #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .login-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 16px; padding: 40px; width: 100%; max-width: 400px; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 8px; }
        .form-input { width: 100%; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: var(--text-main); font-size: 14px; outline: none; }
        .form-input:focus { border-color: var(--gold); }
        .btn-submit { width: 100%; background: var(--gold); color: #000; border: none; border-radius: 8px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; }
        #admin-panel { display: none; }
        header { background-color: var(--bg-secondary); border-bottom: 1px solid var(--border); padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        .stat-title { font-size: 13px; color: var(--text-muted); text-transform: uppercase; }
        .stat-value { font-size: 28px; font-weight: 700; color: var(--gold); margin-top: 8px; }
        .filter-bar { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 25px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
        .appointments-table-container { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 16px; font-size: 14px; border-bottom: 1px solid var(--border); }
        th { background: var(--bg-card); color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 11px; }
        .badge { padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; background: rgba(34, 197, 94, 0.1); color: var(--accent); }
        .btn-action { background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main); padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
        .btn-action.whatsapp { background: rgba(37, 211, 102, 0.1); color: #25d366; }
        .btn-action.cancel { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        .empty-state { text-align: center; padding: 40px; color: var(--text-muted); }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h1 style="color: var(--gold); font-size: 20px; text-align:center; margin-bottom:20px;">PAINEL DO BARBEIRO</h1>
            <div class="form-group"><label class="form-label">Usuário</label><input type="text" class="form-input" id="login-user" placeholder="admin"></div>
            <div class="form-group"><label class="form-label">Senha</label><input type="password" class="form-input" id="login-pass" placeholder="imperial2026"></div>
            <button class="btn-submit" onclick="handleLogin()">Entrar</button>
            <div id="login-error" style="color:var(--danger); font-size:12px; margin-top:10px; text-align:center; display:none;">Usuário ou senha incorretos!</div>
        </div>
    </div>

    <div id="admin-panel">
        <header>
            <div style="display:flex; align-items:center; gap:12px;">
                <div style="background:var(--gold); color:#000; width:36px; height:36px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-weight:bold;">✂</div>
                <div><h2 style="font-size:16px;">Barbearia Imperial</h2><p style="font-size:11px; color:var(--gold);">Painel Supabase</p></div>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <button class="btn-action" onclick="loadAdminData()">🔄 Atualizar Agora</button>
                <button onclick="handleLogout()" style="background:none; border:1px solid var(--danger); color:var(--danger); padding:8px 12px; border-radius:8px; cursor:pointer;">Sair</button>
            </div>
        </header>

        <div class="container">
            <div class="stats-grid">
                <div class="stat-card"><div class="stat-title">Total</div><div class="stat-value" id="stat-total">0</div></div>
                <div class="stat-card"><div class="stat-title">Hoje</div><div class="stat-value" id="stat-today">0</div></div>
                <div class="stat-card"><div class="stat-title">Faturamento</div><div class="stat-value" id="stat-revenue">R$ 0,00</div></div>
            </div>

            <div class="filter-bar">
                <div style="flex:1; min-width:200px;">
                    <label class="form-label">Profissional</label>
                    <select class="form-input" id="filter-barber" onchange="renderTable()">
                        <option value="">Todos</option>
                        <option value="Elilto Lima">Elilto Lima</option>
                        <option value="Marcos Vinicius">Marcos Vinicius</option>
                        <option value="Lucas Souza">Lucas Souza</option>
                    </select>
                </div>
                <div style="flex:1; min-width:200px;">
                    <label class="form-label">Data</label>
                    <input type="date" class="form-input" id="filter-date" onchange="renderTable()">
                </div>
                <div><button class="btn-action" style="padding:12px;" onclick="document.getElementById('filter-barber').value=''; document.getElementById('filter-date').value=''; renderTable();">Limpar</button></div>
            </div>

            <div class="appointments-table-container">
                <table>
                    <thead><tr><th>Data / Horário</th><th>Cliente</th><th>Serviço</th><th>Profissional</th><th>Valor</th><th>Status</th><th>Ações</th></tr></thead>
                    <tbody id="appointments-tbody"><tr><td colspan="7" class="empty-state">Carregando dados da nuvem...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO DO SUPABASE (Mesmas credenciais do index.html)
        const SUPABASE_URL = "https://supabase.com/dashboard/project/ztkygauprykpenuepwgj/settings/general";
        const SUPABASE_ANON_KEY = "sb_publishable_E0G5N2XS0r9bx8AgF2y9xg_Zt0VtMqM";
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const ADMIN_USER = "admin";
        const ADMIN_PASS = "imperial2026";
        let cloudAppointments = [];

        window.onload = function() {
            if (localStorage.getItem('admin_logged') === 'true') showPanel();
        };

        function handleLogin() {
            if (document.getElementById('login-user').value === ADMIN_USER && document.getElementById('login-pass').value === ADMIN_PASS) {
                localStorage.setItem('admin_logged', 'true');
                showPanel();
            } else {
                document.getElementById('login-error').style.display = 'block';
            }
        }

        function handleLogout() {
            localStorage.removeItem('admin_logged');
            document.getElementById('admin-panel').style.display = 'none';
            document.getElementById('login-screen').style.display = 'flex';
        }

        async function showPanel() {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('admin-panel').style.display = 'block';
            await loadAdminData();
            // Atualiza automaticamente a cada 10 segundos
            setInterval(loadAdminData, 10000);
        }

        async function loadAdminData() {
            try {
                let { data, error } = await supabaseClient.from('appointments').select('*');
                if (!error && data) {
                    cloudAppointments = data.map(item => ({
                        id: item.id,
                        serviceName: item.service_name,
                        servicePrice: item.service_price,
                        barberId: item.barber_id,
                        barberName: item.barber_name,
                        barberPhone: item.barber_phone,
                        date: item.appointment_date,
                        time: item.appointment_time,
                        clientName: item.client_name,
                        clientPhone: item.client_phone,
                        clientObs: item.client_obs
                    }));
                }
            } catch(e) {}
            renderTable();
        }

        function renderTable() {
            cloudAppointments.sort((a, b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time));
            const bFilter = document.getElementById('filter-barber').value;
            const dFilter = document.getElementById('filter-date').value;

            let filtered = cloudAppointments.filter(a => (!bFilter || a.barberName === bFilter) && (!dFilter || a.date === dFilter));

            document.getElementById('stat-total').innerText = cloudAppointments.length;
            const todayStr = new Date().toISOString().split('T')[0];
            document.getElementById('stat-today').innerText = cloudAppointments.filter(a => a.date === todayStr).length;
            const totalRev = cloudAppointments.reduce((acc, curr) => acc + curr.servicePrice, 0);
            document.getElementById('stat-revenue').innerText = `R$ ${totalRev.toFixed(2).replace('.', ',')}`;

            const tbody = document.getElementById('appointments-tbody');
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="empty-state">Nenhum agendamento encontrado.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(a => {
                const [y, m, d] = a.date.split('-');
                const waLink = `https://wa.me/55${a.clientPhone.replace(/\D/g,'')}?text=${encodeURIComponent(`Olá ${a.clientName}, tudo bem? Aqui é da Barbearia Imperial sobre seu agendamento.`)}`;
                return `
                    <tr>
                        <td><strong>${d}/${m}/${y}</strong><br><span style="color:var(--gold);">${a.time}</span></td>
                        <td><strong>${a.clientName}</strong><br><span style="font-size:12px; color:var(--text-muted);">📞 ${a.clientPhone}</span></td>
                        <td>${a.serviceName}</td>
                        <td>${a.barberName}</td>
                        <td style="color:var(--gold);">R$ ${a.servicePrice.toFixed(2).replace('.', ',')}</td>
                        <td><span class="badge">Confirmado</span></td>
                        <td>
                            <div style="display:flex; gap:6px;">
                                <a href="${waLink}" target="_blank" class="btn-action whatsapp">💬 WhatsApp</a>
                                <button class="btn-action cancel" onclick="cancelApp(${a.id})">Cancelar</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function cancelApp(id) {
            if (confirm("Deseja realmente cancelar este agendamento?")) {
                await supabaseClient.from('appointments').delete().eq('id', id);
                await loadAdminData();
            }
        }
    </script>
</body>
</html>
